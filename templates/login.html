<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Study Point Management</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <style>

        body.login-body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: var(--background);
        }

        .login-card {
            width: 100%;
            max-width: 380px;
            background: #ffffff;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 36px 32px;
            box-shadow: 0 4px 20px rgba(17, 24, 39, 0.06);
        }

        .login-brand {
            font-size: 20px;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 4px;
        }

        .login-brand span {
            color: var(--primary);
        }

        .login-subtitle {
            color: var(--text-light);
            font-size: 13px;
            margin-bottom: 28px;
        }

        .login-error {
            background: var(--danger-light);
            color: var(--danger);
            font-size: 13px;
            padding: 10px 12px;
            border-radius: 8px;
            margin-bottom: 18px;
        }

        .login-field {
            margin-bottom: 16px;
        }

        .login-field label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--dark);
            margin-bottom: 6px;
        }

        .login-field input {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
        }

        .login-field input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 6px;
        }

        .login-btn:hover {
            background: var(--primary-dark);
        }

    </style>
</head>
<body class="login-body">

    <div class="login-card">

        <div class="login-brand">
            JIJAU <span>ABHYASIKA</span>
        </div>

        <div class="login-subtitle">
            Study Point Management System
        </div>

        {% if error %}
        <div class="login-error">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="{{ url_for('login') }}">

            <div class="login-field">
                <label>Username</label>
                <input type="text" name="username" required autofocus>
            </div>

            <div class="login-field">
                <label>Password</label>
                <input type="password" name="password" required>
            </div>

            <button type="submit" class="login-btn">
                Log In
            </button>

        </form>

    </div>

</body>
</html>
